name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Spring Boot 4 line tested alongside the default (3.5, in pom.xml)
  SPRING_BOOT_4_VERSION: 4.1.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java ${{ matrix.java }}, Spring Boot ${{ matrix.spring-boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        spring-boot: ['3.5']
        maven-args: ['']          # the default in pom.xml
        include:
          - java: '17'
            spring-boot: '3.3'
            maven-args: '-Dspring-boot.version=3.3.13'
          - java: '17'
            spring-boot: '3.4'
            maven-args: '-Dspring-boot.version=3.4.13'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify ${{ matrix.maven-args }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}-spring-${{ matrix.spring-boot }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  # The default build uses Spring Boot 3.5; this proves the same code works on Spring Boot 4.1.
  spring-boot-4:
    name: Spring Boot 4.1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify -Dspring-boot.version=${SPRING_BOOT_4_VERSION}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-spring-boot-4
          path: '**/target/surefire-reports/'
          retention-days: 7

  # Scans the dependencies, test scope included, for known vulnerabilities, as resolved for
  # each supported Spring Boot line. Dependencies don't change with the JDK, so one JDK is enough.
  dependency-scan:
    name: Dependency scan (Spring Boot ${{ matrix.spring-boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spring-boot: '3.5'
            maven-args: ''        # the default in pom.xml
          - spring-boot: '4.1'
            maven-args: -Dspring-boot.version=${SPRING_BOOT_4_VERSION}
    env:
      OSV_SCANNER_VERSION: v2.7.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Scan dependencies for known vulnerabilities (OSV)
        run: .github/scripts/osv-scan.sh ${{ matrix.maven-args }}
