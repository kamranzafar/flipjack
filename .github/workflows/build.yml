name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # Dependencies don't change with the JDK, so scan once
      - name: Scan dependencies for known vulnerabilities (OSV)
        if: matrix.java == '17'
        env:
          OSV_SCANNER_VERSION: v2.7.0
        run: .github/scripts/osv-scan.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  # The default build uses Spring Boot 3.5; this proves the same code works on Spring Boot 4.1.
  spring-boot-4:
    name: Spring Boot 4.1
    runs-on: ubuntu-latest
    env:
      SPRING_BOOT_VERSION: 4.1.2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify -Dspring-boot.version=${SPRING_BOOT_VERSION}

      - name: Scan dependencies for known vulnerabilities (OSV)
        env:
          OSV_SCANNER_VERSION: v2.7.0
        run: .github/scripts/osv-scan.sh -Dspring-boot.version=${SPRING_BOOT_VERSION}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-spring-boot-4
          path: '**/target/surefire-reports/'
          retention-days: 7
