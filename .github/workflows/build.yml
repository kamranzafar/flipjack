name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # Dependencies don't change with the JDK, so scan once
      - name: Scan dependencies for known vulnerabilities (OSV)
        if: matrix.java == '17'
        env:
          OSV_SCANNER_VERSION: v2.7.0
        run: |
          mvn --batch-mode --no-transfer-progress cyclonedx:makeBom
          base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -o osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
          curl -sSfL -o osv-scanner_SHA256SUMS "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check --strict
          chmod +x osv-scanner_linux_amd64
          cd "$GITHUB_WORKSPACE"
          args=()
          for bom in */target/bom.cdx.json; do args+=(-L "$bom"); done
          "$RUNNER_TEMP/osv-scanner_linux_amd64" scan source "${args[@]}"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7
