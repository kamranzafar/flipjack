name: Inactive assignees

# Reminds contributors after 10 quiet days on an assigned issue, and unassigns them after 14.
# Reminds authors of pull requests 7 quiet days after changes were requested, and closes the
# pull request 7 days after that.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: inactive-assignees
  cancel-in-progress: false

jobs:
  inactive-assignees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/inactive-assignees.js');
            await run({ github, context, core });
